name: Release

# Publishes the APK when a version tag is pushed (v0.2.1, v0.3.0-rc1...). The release page lists the
# CPU architectures the APK carries, read from the built file by scripts/verify-apk.py.
on:
  push:
    tags: ["v*"]

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  CARGO_NDK_VERSION: 4.1.2

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Rust (version from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: NDK e cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${ANDROID_NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
      - name: Version from the tag
        run: echo "LUME_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Signing key (when the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.LUME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lume.jks"
            echo "LUME_KEYSTORE=$RUNNER_TEMP/lume.jks" >> "$GITHUB_ENV"
            echo "LUME_KEYSTORE_PASSWORD=${{ secrets.LUME_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LUME_KEY_ALIAS=${{ secrets.LUME_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LUME_KEY_PASSWORD=${{ secrets.LUME_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::no signing key: the release is signed with the debug key"
          fi
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Name and check the files
        run: |
          mkdir dist
          suffix=$([ -n "$LUME_KEYSTORE" ] && echo "" || echo "-debugsigned")
          apk="dist/lume-${LUME_VERSION_NAME}${suffix}.apk"
          cp android/app/build/outputs/apk/release/app-release*.apk "$apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/lume-${LUME_VERSION_NAME}${suffix}.aab"
          python3 scripts/verify-apk.py "$apk" | tee dist/verify.txt
          echo "APK=$apk" >> "$GITHUB_ENV"
      - name: Release notes with the architectures
        run: |
          abis=$(sed -n 's/^ABIs: //p' dist/verify.txt)
          {
            echo "## Lume ${LUME_VERSION_NAME}"
            echo
            echo "One APK for every supported TV: Android picks the native library that matches the CPU."
            echo
            echo "| Architecture | ABI | In this APK |"
            echo "|---|---|---|"
            for row in "ARMv7 (32 bits)|armeabi-v7a" "ARMv8 (64 bits)|arm64-v8a" "x86_64 (emulators)|x86_64"; do
              name="${row%%|*}"; abi="${row##*|}"
              case ", $abis, " in *", $abi, "*) has="yes";; *) has="no";; esac
              echo "| $name | \`$abi\` | $has |"
            done
            echo
            echo "- Android TV 9 (API 28) or newer."
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
            echo "- Install: \`adb install $(basename "$APK")\` (see the README)."
          } > dist/notes.md
          cat dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--prerelease" || echo "")
          gh release create "$GITHUB_REF_NAME" dist/lume-*.apk dist/lume-*.aab \
            --title "Lume ${LUME_VERSION_NAME}" --notes-file dist/notes.md $prerelease
