# License policy: only accept what is compatible with GPL-3.0-or-later.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "armv7-linux-androideabi",
    "aarch64-linux-android",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "OFL-1.1",
]
