[package]
name = "lume-desktop"
description = "Desktop development harness for lume"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "lume_desktop"
path = "src/lib.rs"

[[bin]]
name = "lume-desktop"
path = "src/main.rs"

[dependencies]
lume-core = { path = "../../crates/lume-core" }
glow = { version = "0.18", default-features = false }
khronos-egl = { version = "6", features = ["dynamic"] }
png = "0.18"
softbuffer = "0.4"
winit = "0.30"
