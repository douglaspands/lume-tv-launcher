[target.aarch64-linux-android]
rustflags = ["-C", "target-cpu=cortex-a53", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "target-cpu=cortex-a53", "-C", "target-feature=+neon", "-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

