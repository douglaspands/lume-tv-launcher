[workspace]
resolver = "2"
members = [
    "crates/lume-css",
    "crates/lume-strings",
    "crates/lume-core",
    "crates/lume-app",
    "tools/lume-desktop",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
